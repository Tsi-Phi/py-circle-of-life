me: Python Lint with Black

on:
  push:
    branches:
      - main
      - 'feature/*'  # You can customize the branches you want to monitor
  pull_request:
    branches:
      - main

jobs:
  lint:
    #runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'  # You can change the Python version as needed

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black

    - name: Run black to check code style
      run: |
        black --check --diff .

    - name: Fail if black is not passing
      if: failure()
      run: |
        echo "Black formatting issues found, please fix them."
        exit 1
